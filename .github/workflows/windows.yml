name: windows
# The release workflow builds every target and only publishes on a tag, and the check workflow
# skips its build job on a pull request. This one is the short path: the Windows executable and
# the Inno Setup installer that ships it, cut on demand for the version it is given, which becomes
# the release's tag and title, with the commits since the last release written out as its notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as a tag and a release title
        type: string
        required: true

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  installer:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          cache-targets: false
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora --target x86_64-pc-windows-msvc

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # Inno Setup writes into this directory, so it has to exist before the script runs.
      - name: prepare the output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      # The same steps the release workflow takes, for the one target it can take here.
      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # The wizard art and the language Setup settles on come from the compiler's own files, so
      # report which compiler this is and that it carries the Chinese messages.
      - name: report the compiler
        shell: pwsh
        run: |
          $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "ISCC $($iscc.VersionInfo.ProductVersion)"
          Get-ChildItem (Join-Path $iscc.Directory "Languages") -Filter "Chinese*.isl" |
            Select-Object -ExpandProperty Name

      - name: build the Windows installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          # x64compatible for the x64 build, arm64 for the ARM one
          SONORA_ARCH: x64compatible
          # Sonora-Setup for the x64 build, Sonora-Setup-arm64 for the ARM one
          SONORA_SETUP: Sonora-Setup
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/x86_64-pc-windows-msvc/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"


      # The release is the one place the installer is handed out from.
      - name: publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "windows-$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # The version is the title, and this paragraph is followed by what the commits since
            # the last release say, so a build explains itself on the releases page.
            $notes = "Windows x64 build of this Sonora fork: download the installer below. It needs no administrator rights. The build is unsigned, so SmartScreen asks for 'More info -> Run anyway' the first time."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:SHA --title $env:VERSION --notes $notes --generate-notes
          }
          gh release upload $tag dist/* --clobber --repo $env:GITHUB_REPOSITORY
