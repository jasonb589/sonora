name: release

# Windows only, the target this copy ships. The macOS bundle, the AppImage and the Flatpak
# jobs are gone with the platforms they built for; a tag cuts the two Windows installers and
# publishes them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: Sonora-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: Sonora-Setup-arm64
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: stage the executable
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item `
            "target/$env:TARGET/release/sonora.exe" `
            "dist/sonora-$env:VERSION-$env:TARGET.exe"

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: stage the licenses
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p licenses
          cp COPYING licenses/LICENSE
          cp THIRD-PARTY.md licenses/THIRD-PARTY.md
          cp assets/fonts/LICENSE.txt licenses/LICENSE.Inter
          mkdir -p licenses/icons
          cp assets/icons/LICENSE licenses/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "licenses/icons/LICENSE.$pack"
          done
          tar -czf "dist/sonora-$VERSION-licenses.tar.gz" -C licenses .

      - name: checksums
        shell: bash
        run: cd dist && shasum -a 256 * > SHA256SUMS

      - name: release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
